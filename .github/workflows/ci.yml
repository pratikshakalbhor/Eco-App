name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend – Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TreeClient
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # jsdom@30 requires Node ^22.22.2 || ^24.15.0 || >=26.0.0
          node-version: 22
          cache: npm
          cache-dependency-path: TreeClient/package-lock.json

      - run: npm ci

      - run: npx vitest run

      - run: npm run build
        env:
          VITE_API_URL: http://localhost:8080

  backend:
    name: Backend – Vet & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend/api-server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: Backend/api-server/go.sum

      - run: go vet ./...

      - run: go test ./... -v -count=1

  blockchain:
    name: Blockchain – Compile & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blockchain
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: blockchain/package-lock.json

      - run: npm ci

      - run: npx hardhat compile

      - run: npx hardhat test
